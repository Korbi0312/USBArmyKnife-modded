<!DOCTYPE html>
<html lang="de">
<head>

    <!--
    noVNC example: lightweight example using minimal UI and features

    This is a self-contained file which doesn't import WebUtil or external CSS.

    Copyright (C) 2019 The noVNC Authors
    noVNC is licensed under the MPL 2.0 (see LICENSE.txt)
    This file is licensed under the 2-Clause BSD license (see LICENSE.txt).

    Connect parameters are provided in query string:
        http://example.com/?host=HOST&port=PORT&scale=true
    -->
    <title>VNC (Remote-Bildschirm)</title>

    <style>

        body {
            margin: 0;
            background-color: dimgrey;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        html {
            height: 100%;
        }

        #top_bar {
            background-color: #6e84a3;
            color: white;
            font: bold 12px Helvetica;
            padding: 6px 5px 4px 5px;
            border-bottom: 1px outset;
        }
        #status {
            text-align: center;
        }
        #sendCtrlAltDelButton {
            position: fixed;
            top: 0px;
            right: 0px;
            border: 1px outset;
            padding: 5px 5px 4px 5px;
            cursor: pointer;
        }

        #screen {
            flex: 1; /* fill remaining space */
            overflow: hidden;
        }

    </style>

    <script type="module" crossorigin="anonymous">
        // RFB holds the API to connect and communicate with a VNC server
        import RFB from './core/rfb.js';

        let rfb;
        let desktopName;

        // When this function is called we have
        // successfully connected to a server
        function connectedToServer(e) {
            status("Verbunden mit " + desktopName);
        }

        // This function is called when we are disconnected
        function disconnectedFromServer(e) {
            if (e.detail.clean) {
                status("Verbindung getrennt");
            } else {
                status("Verbindung abgebrochen (Fehler)");
            }
        }

        // When this function is called, the server requires
        // credentials to authenticate
        function credentialsAreRequired(e) {
            const password = prompt("Passwort erforderlich:");
            rfb.sendCredentials({ password: password });
        }

        // When this function is called we have received
        // a desktop name from the server
        function updateDesktopName(e) {
            desktopName = e.detail.name;
        }

        // Since most operating systems will catch Ctrl+Alt+Del
        // before they get a chance to be intercepted by the browser,
        // we provide a way to emulate this key sequence.
        function sendCtrlAltDel() {
            rfb.sendCtrlAltDel();
            return false;
        }

        // Show a status text in the top bar
        function status(text) {
            document.getElementById('status').textContent = text;
        }

        // This function extracts the value of one variable from the
        // query string. If the variable isn't defined in the URL
        // it returns the default value instead.
        function readQueryVariable(name, defaultValue) {
            // A URL with a query parameter can look like this (But will most probably get logged on the http server):
            // https://www.example.com?myqueryparam=myvalue
            //
            // For privacy (Using a hastag #, the parameters will not be sent to the server)
            // the url can be requested in the following way:
            // https://www.example.com#myqueryparam=myvalue&password=secreatvalue
            //
            // Even Mixing public and non public parameters will work:
            // https://www.example.com?nonsecretparam=example.com#password=secreatvalue
            //
            // Note that we use location.href instead of location.search
            // because Firefox < 53 has a bug w.r.t location.search
            const re = new RegExp('.*[?&]' + name + '=([^&#]*)'),
                  match = ''.concat(document.location.href, window.location.hash).match(re);

            if (match) {
                // We have to decode the URL since want the cleartext value
                return decodeURIComponent(match[1]);
            }

            return defaultValue;
        }

        document.getElementById('sendCtrlAltDelButton')
            .onclick = sendCtrlAltDel;

        const password = readQueryVariable('password');
        const path = readQueryVariable('path', 'websockify');

        status("Verbinde...");

        // Resolve the WebSocket target:
        // 1. Explicit query parameters (host/port) always win.
        // 2. If this page was loaded from the device's own access point the
        //    browser sits in the device network and cannot reach the PC
        //    directly -> always use the relay (the device forwards over its
        //    own LAN connection when configured, otherwise over USB serial).
        // 3. Otherwise ask the device for the PC's direct URL (the Agent
        //    auto-discovered it and stored it as "pc-ip") and connect to it.
        // 4. Fallback: same host as this page -> relay through the device.
        async function resolveTarget() {
            const qHost = readQueryVariable('host', null);
            if (qHost) {
                return { host: qHost, port: readQueryVariable('port', null) || window.location.port, direct: true };
            }
            let pcHost = null, pcPort = '7002', apIp = null;
            try {
                const resp = await fetch('/api/status', { cache: 'no-store' });
                const data = await resp.json();
                if (data) {
                    apIp = data.apIp || null;
                    if (data.vncDirectUrl) {
                        const match = data.vncDirectUrl.match(/^(?:https?:\/\/)?([^/:]+)(?::(\d+))?/);
                        if (match && match[1]) {
                            pcHost = match[1];
                            pcPort = match[2] || '7002';
                        }
                    }
                }
            } catch (e) {
                // ignore, fall back to the relay
            }
            if (apIp && window.location.hostname === apIp) {
                return { host: window.location.hostname, port: window.location.port, direct: false };
            }
            if (pcHost) {
                return { host: pcHost, port: pcPort, direct: true };
            }
            return { host: window.location.hostname, port: window.location.port, direct: false };
        }

        (async () => {
            const target = await resolveTarget();
            const scheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
            let directUrl = scheme + '://' + target.host + (target.port ? ':' + target.port : '') + '/' + path;
            const relayUrl = scheme + '://' + window.location.hostname + (window.location.port ? ':' + window.location.port : '') + '/' + path;

            // Pull the sharpness / frame-rate settings from the device (the page
            // is hosted by the device) and hand them to the PC's VNC server via
            // query parameters. The relay path cannot carry them, there the
            // agent uses the values stored via the VNCSettings command.
            try {
                const resp = await fetch('/api/vncsettings', { cache: 'no-store' });
                const settings = await resp.json();
                if (settings && settings.width && settings.height && settings.fps) {
                    directUrl += '?w=' + settings.width + '&h=' + settings.height + '&fps=' + settings.fps;
                }
            } catch (e) {
                // ignore, connect without settings
            }

            let fallbackUsed = false;

            // Creating a new RFB object will start a new connection
            function connect(url, direct) {
                status(direct ? 'Verbinde direkt mit PC...' : 'Verbinde (Relais)...');
                let directTimer = null;
                if (direct) {
                    // If the direct connection does not establish quickly the
                    // PC is probably unreachable from this network -> fall
                    // back to the relay.
                    directTimer = setTimeout(() => {
                        if (!fallbackUsed) {
                            fallbackUsed = true;
                            status('Keine direkte Verbindung, wechsle zu Relais...');
                            connect(relayUrl, false);
                        }
                    }, 3500);
                }
                rfb = new RFB(document.getElementById('screen'), url,
                              { credentials: { password: password } });

                // Add listeners to important events from the RFB module
                rfb.addEventListener("connect", () => {
                    if (directTimer) { clearTimeout(directTimer); directTimer = null; }
                    connectedToServer();
                });
                rfb.addEventListener("credentialsrequired", credentialsAreRequired);
                rfb.addEventListener("desktopname", updateDesktopName);
                rfb.addEventListener("disconnect", (e) => {
                    if (directTimer) { clearTimeout(directTimer); directTimer = null; }
                    // If the direct connection to the PC fails (e.g. the phone is
                    // only on the device's WiFi AP), fall back to the relay.
                    if (direct && !fallbackUsed) {
                        fallbackUsed = true;
                        status('Direktverbindung fehlgeschlagen, wechsle zu Relais...');
                        connect(relayUrl, false);
                    } else {
                        disconnectedFromServer(e);
                    }
                });

                // Set parameters that can be changed on an active connection
                rfb.viewOnly = readQueryVariable('view_only', false);
                rfb.scaleViewport = readQueryVariable('scale', false);
            }

            connect(target.direct ? directUrl : relayUrl, target.direct);
        })();
    </script>
</head>

<body>
    <div id="top_bar">
        <div id="status">Lade...</div>
        <div id="sendCtrlAltDelButton">Strg+Alt+Entf senden</div>
    </div>
    <div id="screen">
        <!-- This is where the remote screen will appear -->
    </div>
</body>
</html>
