# SPDX-License-Identifier: MIT
name: PlatformIO CI

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build LILYGO-T-Dongle-S3
        run: pio run --environment LILYGO-T-Dongle-S3

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LILYGO-T-Dongle-S3 Firmware binaries
          path: |
            .pio/build/LILYGO-T-Dongle-S3/*.bin
            .pio/build/LILYGO-T-Dongle-S3/*.elf

      - name: Create Release ZIP with Tools
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release/Agent
          cp .pio/build/LILYGO-T-Dongle-S3/*.bin release/Agent/
          cp tools/Installer/"Agent Installer.bat" release/
          cp tools/Installer/"Agent Uninstaller.bat" release/
          cd release
          zip -r ../USBArmyKnife-modded-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: USBArmyKnife-modded-${{ github.ref_name }}.zip
          generate_release_notes: true
