<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USB Army Knife — VNC Remote</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --bg-card: rgba(255,255,255,0.03);
            --bg-input: #1a1a1a;
            --border: rgba(212,175,55,0.15);
            --border-card: rgba(255,255,255,0.06);
            --accent: #d4af37;
            --accent-dim: rgba(212,175,55,0.3);
            --text: #e0e0e0;
            --text-dim: #888;
            --text-heading: #f0e6c5;
            --green: #28a745;
            --red: #dc3545;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }

        /* ── Top Bar ─────────────────────────────────────────────── */
        #topbar {
            height: 42px;
            background: #111118;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            z-index: 10;
        }
        #topbar .logo {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        #topbar .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--red);
            flex-shrink: 0;
            transition: background 0.3s;
        }
        #topbar .status-dot.connected { background: var(--green); }
        #topbar .status-text {
            font-size: 12px;
            color: var(--text-dim);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #topbar .status-text.connected { color: var(--text); }

        /* ── Settings Bar ────────────────────────────────────────── */
        #settingsbar {
            height: 38px;
            background: #0d0d14;
            border-bottom: 1px solid var(--border-card);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 6px;
            overflow-x: auto;
            flex-shrink: 0;
        }
        .sb-group {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 8px;
            border-right: 1px solid rgba(255,255,255,0.06);
            height: 24px;
        }
        .sb-group:last-child { border-right: none; }
        .sb-btn {
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            padding: 3px 10px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }
        .sb-btn:hover { background: rgba(255,255,255,0.12); border-color: var(--accent-dim); }
        .sb-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
        .sb-remote {
            margin-left: auto;
            font-size: 10px;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        /* ── Screen ──────────────────────────────────────────────── */
        #screen {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            position: relative;
            background: #000;
        }
        #screen canvas {
            display: block;
            image-rendering: auto;
            cursor: crosshair;
        }

        /* ── Bottom Bar ──────────────────────────────────────────── */
        #bottombar {
            height: 32px;
            background: #111118;
            border-top: 1px solid var(--border-card);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .bb-btn {
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            padding: 4px 14px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .bb-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); border-color: var(--accent-dim); }
        .bb-btn.danger:hover { border-color: var(--red); color: var(--red); }
    </style>

    <script type="module" crossorigin="anonymous">
        import RFB from './core/rfb.js';

        let rfb;
        let desktopName;
        let remoteControl = true;
        let fbWidth = 0;
        let fbHeight = 0;

        function setStatus(text, connected) {
            document.getElementById('statusText').textContent = text;
            document.getElementById('statusText').classList.toggle('connected', connected);
            document.getElementById('statusDot').classList.toggle('connected', connected);
        }

        function connectedToServer(e) {
            setStatus('Verbunden — ' + desktopName, true);
            patchMouseInput();
        }

        function disconnectedFromServer(e) {
            if (e.detail.clean) {
                setStatus('Verbindung getrennt', false);
            } else {
                setStatus('Verbindung abgebrochen', false);
            }
        }

        function credentialsAreRequired(e) {
            const password = prompt('Passwort erforderlich:');
            rfb.sendCredentials({ password: password });
        }

        function updateDesktopName(e) {
            desktopName = e.detail.name;
        }

        function patchMouseInput() {
            if (!rfb) return;

            fbWidth = rfb._fbWidth;
            fbHeight = rfb._fbHeight;

            const screen = document.getElementById('screen');

            rfb._sendMouse = function(x, y, mask) {
                if (this._rfbConnectionState !== 'connected') return;
                if (this._viewOnly) return;

                const canvas = this._canvas;
                if (!canvas) return;

                const rect = canvas.getBoundingClientRect();
                const cssW = rect.width;
                const cssH = rect.height;

                if (cssW <= 0 || cssH <= 0) return;

                const fbX = Math.round((x / cssW) * fbWidth);
                const fbY = Math.round((y / cssH) * fbHeight);

                RFB.messages.pointerEvent(this._sock,
                    Math.max(0, Math.min(fbX, fbWidth - 1)),
                    Math.max(0, Math.min(fbY, fbHeight - 1)),
                    mask);
            };

            rfb._handleWheel = function(ev) {
                if (this._rfbConnectionState !== 'connected') return;
                if (this._viewOnly) return;

                ev.stopPropagation();
                ev.preventDefault();

                const canvas = this._canvas;
                if (!canvas) return;

                const rect = canvas.getBoundingClientRect();
                const pos = {
                    x: Math.max(0, Math.min(ev.clientX - rect.left, rect.width - 1)),
                    y: Math.max(0, Math.min(ev.clientY - rect.top, rect.height - 1))
                };

                let dY = ev.deltaY;
                if (ev.deltaMode !== 0) dY *= 33;

                if (dY > 0) {
                    this._sendMouse(pos.x, pos.y, this._mouseButtonMask | 0x8);
                    this._sendMouse(pos.x, pos.y, this._mouseButtonMask & ~0x8);
                } else if (dY < 0) {
                    this._sendMouse(pos.x, pos.y, this._mouseButtonMask | 0x10);
                    this._sendMouse(pos.x, pos.y, this._mouseButtonMask & ~0x10);
                }
            };

            const canvas = rfb._canvas;
            if (canvas) {
                canvas.removeEventListener('wheel', rfb._eventHandlers.handleWheel);
                canvas.addEventListener('wheel', rfb._eventHandlers.handleWheel);
            }

            setTimeout(() => {
                const c = document.querySelector('#screen canvas');
                if (c) c.style.cursor = 'crosshair';
            }, 50);
        }

        function connect() {
            if (rfb) {
                try { rfb.disconnect(); } catch (e) {}
                rfb = null;
            }

            const scheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
            const url = scheme + '://' + window.location.hostname + ':' + window.location.port
                      + '/websockify';

            setStatus('Verbinde...', false);
            rfb = new RFB(document.getElementById('screen'), url, {
                viewOnly: !remoteControl,
                scaleViewport: true,
                resizeSession: false,
                showDotCursor: true
            });

            const observer = new MutationObserver(() => {
                const canvas = document.querySelector('#screen canvas');
                if (canvas) canvas.style.cursor = 'crosshair';
            });
            observer.observe(document.getElementById('screen'), { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });

            rfb.addEventListener('connect', connectedToServer);
            rfb.addEventListener('credentialsrequired', credentialsAreRequired);
            rfb.addEventListener('desktopname', updateDesktopName);
            rfb.addEventListener('disconnect', disconnectedFromServer);
        }

        function reconnect() { connect(); }

        document.getElementById('btnRemote').addEventListener('click', () => {
            remoteControl = !remoteControl;
            const btn = document.getElementById('btnRemote');
            btn.textContent = remoteControl ? 'Mouse+Keyboard: AN' : 'Mouse+Keyboard: AUS';
            btn.classList.toggle('active', remoteControl);
            if (rfb) rfb.viewOnly = !remoteControl;
        });

        document.getElementById('btnReconnect').addEventListener('click', reconnect);

        document.getElementById('btnDisconnect').addEventListener('click', () => {
            if (rfb) { try { rfb.disconnect(); } catch (e) {} rfb = null; }
            setStatus('getrennt', false);
        });

        document.getElementById('btnCtrlAltDel').addEventListener('click', () => {
            if (rfb) rfb.sendCtrlAltDel();
        });

        async function verifyPassword(pw) {
            try {
                const resp = await fetch('/api/verify-password?pw=' + encodeURIComponent(pw), { cache: 'no-store' });
                const data = await resp.json();
                return data.ok === true;
            } catch (e) { return false; }
        }

        let hasPassword = false;
        try {
            const resp = await fetch('/api/settings', { cache: 'no-store' });
            const data = await resp.json();
            hasPassword = data && data.hasPassword === true;
        } catch (e) {}

        if (hasPassword) {
            let attempts = 0;
            let authenticated = false;
            while (attempts < 3 && !authenticated) {
                const pw = prompt('VNC-Passwort erforderlich:');
                if (pw === null) { setStatus('Abgebrochen', false); break; }
                authenticated = await verifyPassword(pw);
                if (!authenticated) {
                    attempts++;
                    if (attempts < 3) alert('Falsches Passwort. Nochmal versuchen.');
                }
            }
            if (authenticated) connect();
        } else {
            connect();
        }
    </script>
</head>

<body>
    <div id="topbar">
        <span class="logo">USB ARMY KNIFE</span>
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Verbinde...</span>
    </div>

    <div id="settingsbar">
        <div class="sb-group">
            <button class="sb-btn active" id="btnRemote">Mouse+Keyboard: AN</button>
        </div>
        <div class="sb-group">
            <button class="sb-btn" id="btnReconnect">Neu verbinden</button>
        </div>
        <span class="sb-remote" id="remoteLink"></span>
    </div>

    <div id="screen"></div>

    <div id="bottombar">
        <button class="bb-btn" id="btnCtrlAltDel">Strg+Alt+Entf</button>
        <button class="bb-btn danger" id="btnDisconnect">Trennen</button>
    </div>
</body>
</html>
